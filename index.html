<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Newsec Elgruppen</title>

<style>
:root{
  --blue:#1769aa;
  --blue-dark:#12558c;
  --ok:#35b86b;
  --part:#f2c94c;
  --no:#e74c3c;
  --text:#1d2733;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#eef2f6;
  color:var(--text);
}

header{
  background:var(--blue);
  color:white;
  padding:18px 16px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:23px;
  font-weight:700;
}

header p{
  margin:4px 0 0;
  font-size:13px;
  opacity:.9;
}

.container{
  max-width:650px;
  margin:0 auto;
  padding:12px;
}

.people{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:5px;
  scrollbar-width:none;
}

.people::-webkit-scrollbar{
  display:none;
}

.person{
  flex:1 0 auto;
  min-width:92px;
  border:0;
  border-radius:10px;
  padding:9px 7px;
  background:white;
  font-size:13px;
  font-weight:600;
  color:var(--text);
  box-shadow:0 1px 4px rgba(0,0,0,.08);
  cursor:pointer;
}

.person.active{
  background:var(--blue);
  color:white;
}

.personStatusDot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  margin-right:5px;
  vertical-align:middle;
  box-shadow:0 0 0 1px rgba(0,0,0,.08);
}

.personStatusDot.ok{
  background:var(--ok);
}

.personStatusDot.part{
  background:var(--part);
}

.personStatusDot.no{
  background:var(--no);
}

.todayAllBtn{
  width:100%;
  margin-top:9px;
  border:0;
  border-radius:10px;
  background:white;
  color:var(--blue);
  font-size:14px;
  font-weight:600;
  padding:11px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
  cursor:pointer;
}

.todayOverview{
  display:none;
  margin-top:8px;
  background:white;
  border-radius:10px;
  padding:10px 12px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.todayOverview.show{
  display:block;
}

.todayRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7px 0;
  border-bottom:1px solid #edf0f3;
  font-size:14px;
}

.todayRow:last-child{
  border-bottom:0;
}

.todayStatus{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:600;
}

.statusDot{
  width:11px;
  height:11px;
  border-radius:50%;
  display:inline-block;
}

.statusDot.ok{
  background:var(--ok);
}

.statusDot.part{
  background:var(--part);
}

.statusDot.no{
  background:var(--no);
}

.calendarBox{
  background:white;
  margin-top:12px;
  border-radius:12px;
  padding:12px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.weekNav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.navBtn{
  width:42px;
  height:38px;
  border:0;
  border-radius:9px;
  background:#edf2f7;
  color:var(--blue);
  font-size:21px;
  font-weight:700;
  cursor:pointer;
}

.weekTitle{
  flex:1;
  text-align:center;
  font-size:14px;
  font-weight:700;
}

.smallToday{
  display:block;
  margin:7px auto 0;
  border:0;
  background:none;
  color:var(--blue);
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}

.weekdays{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  margin-top:13px;
}

.weekday{
  text-align:center;
  font-size:11px;
  font-weight:700;
  color:#66717d;
}

.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-top:5px;
}

.day{
  min-height:64px;
  border-radius:9px;
  background:#f7f9fb;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  border:2px solid transparent;
}

.day.selected{
  border-color:var(--blue);
}

.day.weekend{
  background:#e1e4e8;
  color:#a1a7ae;
  cursor:default;
}

.dayNum{
  font-size:12px;
  margin-bottom:5px;
}

.circle{
  width:29px;
  height:29px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:14px;
  font-weight:700;
}

.circle.ok{
  background:var(--ok);
}

.circle.part{
  background:var(--part);
  color:#6d5700;
}

.circle.no{
  background:var(--no);
}

.legend{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
  margin-top:12px;
  font-size:11px;
  color:#59636e;
}

.legendItem{
  display:flex;
  align-items:center;
  gap:5px;
}

.legendDot{
  width:10px;
  height:10px;
  border-radius:50%;
}

.legendDot.ok{
  background:var(--ok);
}

.legendDot.part{
  background:var(--part);
}

.legendDot.no{
  background:var(--no);
}

.noteBox{
  background:white;
  margin-top:12px;
  border-radius:12px;
  padding:12px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.noteBox h3{
  margin:0 0 8px;
  font-size:14px;
}

.weekNotes{
  margin-bottom:10px;
}

.weekNote{
  padding:8px 0;
  border-bottom:1px solid #edf0f3;
  font-size:13px;
  line-height:1.4;
}

.weekNote:last-child{
  border-bottom:0;
}

.weekNoteDate{
  display:block;
  font-weight:700;
  color:var(--blue);
  margin-bottom:2px;
}

.noNotes{
  color:#8a939d;
  font-size:13px;
  padding:4px 0 8px;
}

textarea{
  width:100%;
  min-height:75px;
  resize:vertical;
  border:1px solid #d5dbe1;
  border-radius:8px;
  padding:9px;
  font-family:inherit;
  font-size:14px;
  outline:none;
}

textarea:focus{
  border-color:var(--blue);
}

.saveBtn{
  width:100%;
  margin-top:8px;
  border:0;
  border-radius:9px;
  padding:10px;
  background:var(--blue);
  color:white;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.connection{
  text-align:center;
  font-size:11px;
  color:#68737e;
  margin:12px 0 3px;
}

@media(max-width:400px){
  .person{
    min-width:85px;
    font-size:12px;
  }

  .day{
    min-height:60px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Newsec Elgruppen</h1>
  <p>Planera tillgänglighet tillsammans</p>
</header>

<div class="container">

  <div class="people" id="people"></div>

  <button class="todayAllBtn" id="todayAllBtn">
    📅 Idag – visa allas status
  </button>

  <div class="todayOverview" id="todayOverview"></div>

  <div class="calendarBox">

    <div class="weekNav">
      <button class="navBtn" id="prevWeek">‹</button>

      <div>
        <div class="weekTitle" id="weekTitle"></div>
        <button class="smallToday" id="todayBtn">Idag</button>
      </div>

      <button class="navBtn" id="nextWeek">›</button>
    </div>

    <div class="weekdays">
      <div class="weekday">Mån</div>
      <div class="weekday">Tis</div>
      <div class="weekday">Ons</div>
      <div class="weekday">Tor</div>
      <div class="weekday">Fre</div>
      <div class="weekday">Lör</div>
      <div class="weekday">Sön</div>
    </div>

    <div class="days" id="days"></div>

    <div class="legend">
      <div class="legendItem">
        <span class="legendDot ok"></span>
        Tillgänglig
      </div>

      <div class="legendItem">
        <span class="legendDot part"></span>
        Delvis
      </div>

      <div class="legendItem">
        <span class="legendDot no"></span>
        Frånvarande
      </div>
    </div>

  </div>

  <div class="noteBox">

    <h3>Anteckningar för veckan</h3>

    <div class="weekNotes" id="weekNotes"></div>

    <textarea
      id="note"
      placeholder="Skriv en anteckning för vald dag..."
    ></textarea>

    <button class="saveBtn" id="saveNote">
      💾 Spara
    </button>

  </div>

  <div class="connection" id="connection">
    Ansluter till kalendern...
  </div>

</div>


<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  onSnapshot,
  collection
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyDf6bd0Fi7PG4lOlVdw5Ie-mx3y20hn2ZY",
  authDomain: "newsec-elgruppen.firebaseapp.com",
  projectId: "newsec-elgruppen",
  storageBucket: "newsec-elgruppen.firebasestorage.app",
  messagingSenderId: "460978187079",
  appId: "1:460978187079:web:404760825c79fd218b7a62"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


const people = [
  "Pétur",
  "Niclas",
  "Michael",
  "Ivan",
  "Max"
];

let currentPerson = people[0];

let currentWeek = monday(new Date());

let selected = 0;

let allCalendarRecords = new Map();

let unsubscribeAll = null;


/* =========================
   DATUM
   ========================= */

function monday(d){

  const x = new Date(d);

  const day = x.getDay();

  const diff =
    day === 0 ? -6 : 1 - day;

  x.setDate(
    x.getDate()+diff
  );

  x.setHours(0,0,0,0);

  return x;
}


function dateKey(d){

  return d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,"0") + "-" +
    String(d.getDate()).padStart(2,"0");

}


function docId(personName,d){

  return (
    personName + "_" + dateKey(d)
  ).replace(
    /[^A-Za-z0-9ÅÄÖåäöÉé_-]/g,
    "_"
  );

}


function selectedDate(){

  const d =
    new Date(currentWeek);

  d.setDate(
    d.getDate()+selected
  );

  return d;

}


/* =========================
   STATUS
   ========================= */

function getRecord(personName,d){

  return allCalendarRecords.get(
    docId(personName,d)
  ) || null;

}


function getStatus(personName,d){

  const record =
    getRecord(personName,d);

  return record?.status || "ok";

}


function statusText(status){

  if(status === "no")
    return "Frånvarande";

  if(status === "part")
    return "Delvis tillgänglig";

  return "Tillgänglig";

}


/* =========================
   NAMN OCH FÄRGER
   ========================= */

function renderPeople(){

  const container =
    document.getElementById("people");

  container.innerHTML = "";

  /*
    SAMMA VALDA DATUM används för
    samtliga fem personer.
  */

  const d = selectedDate();

  people.forEach(person => {

    const button =
      document.createElement("button");

    button.className =
      "person" +
      (
        person === currentPerson
          ? " active"
          : ""
      );


    const status =
      getStatus(person,d);


    const dot =
      document.createElement("span");

    dot.className =
      "personStatusDot " + status;


    button.appendChild(dot);

    button.appendChild(
      document.createTextNode(person)
    );


    button.addEventListener(
      "click",
      () => {

        currentPerson = person;

        render();

      }
    );


    container.appendChild(button);

  });

}


/* =========================
   VECKOKALENDER
   ========================= */

function renderWeek(){

  const title =
    document.getElementById("weekTitle");

  const friday =
    new Date(currentWeek);

  friday.setDate(
    friday.getDate()+4
  );


  const months = [
    "jan","feb","mar","apr","maj","jun",
    "jul","aug","sep","okt","nov","dec"
  ];


  title.textContent =
    currentWeek.getDate() +
    " " +
    months[currentWeek.getMonth()] +
    " – " +
    friday.getDate() +
    " " +
    months[friday.getMonth()] +
    " " +
    friday.getFullYear();


  const daysContainer =
    document.getElementById("days");

  daysContainer.innerHTML = "";


  for(let i=0;i<7;i++){

    const d =
      new Date(currentWeek);

    d.setDate(
      d.getDate()+i
    );


    const day =
      document.createElement("div");

    day.className = "day";


    if(i >= 5){

      day.classList.add("weekend");

    }


    if(i === selected){

      day.classList.add("selected");

    }


    const num =
      document.createElement("div");

    num.className = "dayNum";

    num.textContent =
      d.getDate();

    day.appendChild(num);


    const circle =
      document.createElement("div");

    circle.className = "circle";


    if(i >= 5){

      circle.classList.add("ok");

      circle.textContent = "–";

    }
    else{

      const status =
        getStatus(currentPerson,d);

      circle.classList.add(status);


      if(status === "no"){
        circle.textContent = "✕";
      }
      else if(status === "part"){
        circle.textContent = "•";
      }
      else{
        circle.textContent = "✓";
      }

    }


    day.appendChild(circle);


    if(i < 5){

      day.addEventListener(
        "click",
        async () => {

          /*
            Första klicket på en annan dag:
            välj dagen.

            När dagen redan är vald:
            ändra status.
          */

          if(selected !== i){

            selected = i;

            render();

            return;

          }


          await changeStatus();

        }
      );

    }


    daysContainer.appendChild(day);

  }

}


/* =========================
   ÄNDRA STATUS
   ========================= */

async function changeStatus(){

  const d =
    selectedDate();

  const id =
    docId(currentPerson,d);

  const current =
    getStatus(currentPerson,d);


  let next;


  if(current === "ok"){
    next = "part";
  }
  else if(current === "part"){
    next = "no";
  }
  else{
    next = "ok";
  }


  const existing =
    getRecord(currentPerson,d);


  await setDoc(
    doc(db,"calendar",id),
    {
      person:currentPerson,
      date:dateKey(d),
      status:next,
      note:existing?.note || "",
      updatedAt:Date.now()
    }
  );

}


/* =========================
   VECKANS ANTECKNINGAR
   ========================= */

function renderWeekNotes(){

  const container =
    document.getElementById("weekNotes");

  container.innerHTML = "";


  const dayNames = [
    "Måndag",
    "Tisdag",
    "Onsdag",
    "Torsdag",
    "Fredag"
  ];


  let found = false;


  for(let i=0;i<5;i++){

    const d =
      new Date(currentWeek);

    d.setDate(
      d.getDate()+i
    );


    const record =
      getRecord(currentPerson,d);


    if(
      record?.note &&
      record.note.trim() !== ""
    ){

      found = true;


      const note =
        document.createElement("div");

      note.className =
        "weekNote";


      const date =
        document.createElement("span");

      date.className =
        "weekNoteDate";


      date.textContent =
        dayNames[i] +
        " " +
        d.getDate() +
        "/" +
        (d.getMonth()+1);


      const text =
        document.createElement("div");

      text.textContent =
        record.note;


      note.appendChild(date);

      note.appendChild(text);

      container.appendChild(note);

    }

  }


  if(!found){

    const empty =
      document.createElement("div");

    empty.className =
      "noNotes";

    empty.textContent =
      "Inga anteckningar för " +
      currentPerson +
      " den här veckan.";

    container.appendChild(empty);

  }

}


/* =========================
   VALD DAGS ANTECKNING
   ========================= */

function renderNote(){

  const d =
    selectedDate();

  const record =
    getRecord(currentPerson,d);


  document.getElementById(
    "note"
  ).value =
    record?.note || "";

}


/* =========================
   HELA VYN
   ========================= */

function render(){

  renderPeople();

  renderWeek();

  renderWeekNotes();

  renderNote();

}


/* =========================
   VECKA BAKÅT
   ========================= */

document.getElementById("prevWeek")
.addEventListener("click", () => {

  currentWeek.setDate(
    currentWeek.getDate()-7
  );

  selected = 0;

  render();

});


/* =========================
   VECKA FRAMÅT
   ========================= */

document.getElementById("nextWeek")
.addEventListener("click", () => {

  currentWeek.setDate(
    currentWeek.getDate()+7
  );

  selected = 0;

  render();

});


/* =========================
   IDAG
   ========================= */

document.getElementById("todayBtn")
.addEventListener("click", () => {

  const now =
    new Date();


  /*
    Sätt kalendern till aktuell vecka.
  */

  currentWeek =
    monday(now);


  /*
    Sätt den valda dagen till
    dagens arbetsdag.

    Lördag och söndag pekar på fredag.
  */

  const jsDay =
    now.getDay();


  if(jsDay === 0){

    selected = 4;

  }
  else if(jsDay === 6){

    selected = 4;

  }
  else{

    selected = jsDay - 1;

  }


  /*
    Samma selectedDate() används nu
    av personernas färgmarkeringar.
  */

  render();

});


/* =========================
   IDAG – ALLAS STATUS
   ========================= */

document.getElementById("todayAllBtn")
.addEventListener("click", async () => {

  const overview =
    document.getElementById(
      "todayOverview"
    );


  /*
    VIKTIGT:

    "Idag" väljer först dagens datum
    i kalendern.

    Därmed kommer färgerna högst upp
    automatiskt att visa samma dag.
  */

  const now =
    new Date();


  currentWeek =
    monday(now);


  const jsDay =
    now.getDay();


  if(jsDay === 0){

    selected = 4;

  }
  else if(jsDay === 6){

    selected = 4;

  }
  else{

    selected = jsDay - 1;

  }


  /*
    Uppdatera kalendern och färgerna
    innan översikten visas.
  */

  render();


  if(
    overview.classList.contains("show")
  ){

    overview.classList.remove("show");

    return;

  }


  await renderTodayOverview();

  overview.classList.add("show");

});


async function renderTodayOverview(){

  /*
    Använd exakt samma datum som
    "Idag" just valde.
  */

  const today =
    selectedDate();


  const container =
    document.getElementById(
      "todayOverview"
    );

  container.innerHTML = "";


  for(const name of people){

    const ref =
      doc(
        db,
        "calendar",
        docId(name,today)
      );


    const snap =
      await getDoc(ref);


    const data =
      snap.exists()
        ? snap.data()
        : null;


    const status =
      data?.status || "ok";


    const row =
      document.createElement("div");

    row.className =
      "todayRow";


    const nameEl =
      document.createElement("span");

    nameEl.textContent =
      name;


    const statusEl =
      document.createElement("span");

    statusEl.className =
      "todayStatus";


    const dot =
      document.createElement("span");

    dot.className =
      "statusDot " + status;


    statusEl.appendChild(dot);

    statusEl.appendChild(
      document.createTextNode(
        statusText(status)
      )
    );


    row.appendChild(nameEl);

    row.appendChild(statusEl);

    container.appendChild(row);

  }

}


/* =========================
   SPARA ANTECKNING
   ========================= */

document.getElementById("saveNote")
.addEventListener("click", async () => {

  const d =
    selectedDate();


  const id =
    docId(currentPerson,d);


  const existing =
    getRecord(currentPerson,d);


  const note =
    document.getElementById(
      "note"
    ).value;


  await setDoc(
    doc(db,"calendar",id),
    {
      person:currentPerson,
      date:dateKey(d),
      status:existing?.status || "ok",
      note:note,
      updatedAt:Date.now()
    }
  );

});


/* =========================
   FIRESTORE REALTID
   ========================= */

function subscribeToCalendar(){

  if(unsubscribeAll){

    unsubscribeAll();

  }


  unsubscribeAll =
    onSnapshot(
      collection(db,"calendar"),

      snapshot => {

        allCalendarRecords =
          new Map();


        snapshot.forEach(item => {

          allCalendarRecords.set(
            item.id,
            item.data()
          );

        });


        document.getElementById(
          "connection"
        ).textContent =
          "🟢 Ansluten – ändringar uppdateras direkt";


        /*
          Detta uppdaterar färgerna högst upp
          för ALLA fem personer.
        */

        render();

      },


      error => {

        console.error(error);


        document.getElementById(
          "connection"
        ).textContent =
          "🔴 Kunde inte ansluta till kalendern";

      }
    );

}


/* =========================
   START
   ========================= */

subscribeToCalendar();

render();

</script>

</body>
</html>
